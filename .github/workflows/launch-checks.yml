name: launch-checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: shared/launch-checks/sync.sh --check
      - run: cd shared/launch-checks && npm install && npx playwright install --with-deps chromium && npm test
      - run: pip install requests && cd shared/launch-checks && npm run test:py
